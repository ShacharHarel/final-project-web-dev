<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פרופילי צפייה</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="app-page management-page">
    <header class="top-nav">
        <a class="brand-logo" href="/feed">NETFLIX</a>
        <nav class="nav-links">
            <a href="/feed">⌂ ראשי</a><a href="/contents">▣ קטלוג</a>
            <a class="active" href="/profiles">♙ פרופילים</a><a href="/watch-history">◷ היסטוריה</a>
        </nav>
        <button id="logout-button" class="logout-button" type="button">↪ יציאה</button>
    </header>
    <main class="page-main narrow-main">
        <div class="page-heading"><p class="eyebrow">מי צופה עכשיו?</p><h1>פרופילי צפייה</h1></div>
        <section class="netflix-panel profile-form-section">
            <h2 id="profile-form-title">הוספת פרופיל</h2>
            <form id="profile-form" class="management-form">
                <input id="profile-name" type="text" placeholder="שם הפרופיל" minlength="2" required>
                <input id="profile-age" type="number" min="1" max="120" placeholder="גיל" required>
                <input id="favorite-categories" type="text" placeholder="קטגוריות מועדפות, מופרדות בפסיק">
                <div class="form-actions">
                    <button id="profile-submit-button" type="submit">הוספה</button>
                    <button id="cancel-profile-edit" class="secondary-button" type="button" hidden>ביטול עריכה</button>
                </div>
            </form>
            <p id="profile-form-message" class="form-message"></p>
        </section>
        <section class="netflix-panel search-section">
            <h2>חיפוש פרופיל</h2>
            <form id="profile-search-form" class="search-form">
                <input id="profile-search-name" type="text" placeholder="חיפוש לפי שם" required>
                <button type="submit">⌕ חיפוש</button>
                <button id="clear-profile-search" class="secondary-button" type="button">הצגת הכול</button>
            </form>
        </section>
        <div class="section-title"><h2>הפרופילים שלי</h2></div>
        <p id="profile-message" class="status-message">טוען פרופילים...</p>
        <section id="profile-list" class="profile-grid"></section>
    </main>
    <script src="/js/auth.js"></script><script src="/js/profiles.js"></script>
</body>
</html>
