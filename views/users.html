<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול משתמשים</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <h1>ניהול משתמשים</h1>
        <nav>
            <a href="/feed">חזרה לפיד</a>
        </nav>
    </header>

    <main>
        <section class="search-section">
            <h2>חיפוש משתמש</h2>
            <form id="user-search-form">
                <input id="user-search" type="text" placeholder="שם משתמש או אימייל" required>
                <button type="submit">חיפוש</button>
                <button id="clear-user-search" type="button">הצגת הכול</button>
            </form>
        </section>

        <h2>רשימת משתמשים</h2>
        <p id="user-message">טוען משתמשים...</p>
        <section id="user-list" class="user-grid"></section>
    </main>

    <script src="/js/users.js"></script>
</body>
</html>
