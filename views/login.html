<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>כניסה ל־Netflix</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
    <header class="top-nav auth-nav">
        <a class="brand-logo" href="/">NETFLIX</a>
    </header>

    <main class="auth-main">
        <section class="auth-section">
            <h1>כניסה</h1>
            <form id="login-form" class="auth-form">
                <input id="email" type="email" placeholder="אימייל" autocomplete="email" required>
                <input id="password" type="password" placeholder="סיסמה" autocomplete="current-password" required>
                <button type="submit">כניסה</button>
            </form>
            <p id="auth-message" class="form-message"></p>
            <p class="muted-text">חדשים ב־Netflix? <a href="/register">הירשמו עכשיו</a></p>
            <a class="back-link" href="/">⌂ חזרה לדף הבית</a>
        </section>
    </main>

    <script src="/js/auth.js"></script>
</body>
</html>
