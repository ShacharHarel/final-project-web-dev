<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>קטלוג תכנים</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <h1>קטלוג התכנים</h1>
        <a href="/">דף הבית</a>
    </header>

    <main>
        <section class="content-form-section">
            <h2 id="form-title">הוספת תוכן</h2>

            <form id="content-form">
                <input id="title" type="text" placeholder="שם התוכן" required>
                <textarea id="description" placeholder="תיאור" required></textarea>
                <input id="category" type="text" placeholder="קטגוריה" required>

                <select id="type" required>
                    <option value="">בחרו סוג תוכן</option>
                    <option value="movie">סרט</option>
                    <option value="series">סדרה</option>
                </select>

                <input id="releaseYear" type="number" placeholder="שנת יציאה" required>
                <input id="rating" type="number" min="0" max="10" placeholder="דירוג">
                <input id="videoUrl" type="text" placeholder="קישור לווידאו" required>
                <input id="imageUrl" type="text" placeholder="קישור לתמונה" required>
                <input id="address" type="text" placeholder="כתובת לצורך המפה">

                <button id="submit-button" type="submit">הוספה</button>
                <button id="cancel-edit-button" type="button" hidden>ביטול עריכה</button>
            </form>

            <p id="form-message"></p>
        </section>

        <h2>רשימת תכנים</h2>
        <p id="message">טוען תכנים...</p>
        <section id="content-list" class="content-grid"></section>
    </main>

    <script src="/js/contents.js"></script>
</body>
</html>
