<!DOCTYPE html>
<!-- מסך קטלוג התכנים: כולל טופס מנהל, חיפוש ורשימת סרטים וסדרות. -->
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>קטלוג התכנים</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="app-page catalog-page">
    <header class="top-nav">
        <a class="brand-logo" href="/feed"><img src="/images/netflix-logo.svg" alt="Netflix"></a>
        <nav class="nav-links">
            <a href="/feed">⌂ ראשי</a>
            <a class="active" href="/contents">▣ סרטים וסדרות</a>
            <a href="/profiles">♙ פרופילים</a>
            <a href="/explore">⌕ חיפוש מתקדם</a>
        </nav>
    </header>

    <main class="page-main">
        <div class="page-heading">
            <p class="eyebrow">כל מה שכדאי לראות</p>
            <h1>סרטים וסדרות</h1>
        </div>

        <section id="content-management" class="netflix-panel content-form-section" hidden>
            <h2 id="form-title">הוספת תוכן</h2>
            <form id="content-form" class="management-form">
                <input id="title" type="text" placeholder="שם התוכן" required>
                <textarea id="description" placeholder="תיאור" required></textarea>
                <input id="category" type="text" placeholder="קטגוריה" required>
                <select id="type" required>
                    <option value="">בחרו סוג תוכן</option>
                    <option value="movie">סרט</option>
                    <option value="series">סדרה</option>
                </select>
                <input id="releaseYear" type="number" placeholder="שנת יציאה" required>
                <input id="rating" type="number" min="0" max="10" step="0.1" placeholder="דירוג">
                <input id="videoUrl" type="url" placeholder="קישור לטריילר" required>
                <input id="imageUrl" type="url" placeholder="קישור לתמונה" required>
                <input id="address" type="text" placeholder="כתובת לצורך המפה">
                <div class="form-actions">
                    <button id="submit-button" type="submit">הוספה</button>
                    <button id="cancel-edit-button" class="secondary-button" type="button" hidden>ביטול עריכה</button>
                </div>
            </form>
            <p id="form-message" class="form-message"></p>
        </section>

        <section class="netflix-panel search-section">
            <h2>חיפוש בקטלוג</h2>
            <form id="search-form" class="search-form">
                <input id="search-title" type="text" placeholder="שם הסרט או הסדרה" required>
                <button type="submit">⌕ חיפוש</button>
                <button id="clear-search-button" class="secondary-button" type="button">הצגת הכול</button>
            </form>
        </section>

        <div class="section-title"><h2>הקטלוג שלנו</h2></div>
        <p id="message" class="status-message">טוען תכנים...</p>
        <section id="content-list" class="content-grid"></section>
    </main>
    <script src="/js/contents.js"></script>
</body>
</html>
