<!DOCTYPE html>
<!-- מסך ביקורות ודירוגים: כולל טופס CRUD, חיפוש ורשימת ביקורות. -->
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ביקורות ודירוגים</title><link rel="stylesheet" href="/css/style.css">
</head>
<body class="app-page management-page">
    <header class="top-nav">
        <a class="brand-logo" href="/feed"><img src="/images/netflix-logo.svg" alt="Netflix"></a>
        <nav class="nav-links"><a href="/feed">⌂ ראשי</a><a href="/contents">▣ קטלוג</a><a href="/watch-history">◷ היסטוריה</a><a class="active" href="/reviews">★ ביקורות</a></nav>
        <button id="logout-button" class="logout-button" type="button">↪ יציאה</button>
    </header>
    <main class="page-main narrow-main">
        <div class="page-heading"><p class="eyebrow">מה חשבתם?</p><h1>ביקורות ודירוגים</h1></div>
        <section class="netflix-panel review-form-section">
            <h2 id="review-form-title">הוספת ביקורת</h2>
            <form id="review-form" class="management-form">
                <select id="review-content" required><option value="">בחירת תוכן</option></select>
                <input id="review-rating" type="number" min="1" max="10" placeholder="דירוג 1 עד 10" required>
                <textarea id="review-text" maxlength="500" placeholder="כתיבת ביקורת" required></textarea>
                <div class="form-actions"><button id="review-submit-button" type="submit">פרסום ביקורת</button><button id="cancel-review-edit" class="secondary-button" type="button" hidden>ביטול עריכה</button></div>
            </form>
            <p id="review-form-message" class="form-message"></p>
        </section>
        <section class="netflix-panel search-section">
            <h2>חיפוש לפי תוכן</h2>
            <form id="review-search-form" class="search-form">
                <select id="review-search-content" required><option value="">בחירת תוכן</option></select>
                <button type="submit">⌕ חיפוש</button><button id="clear-review-search" class="secondary-button" type="button">הצגת הכול</button>
            </form>
        </section>
        <div class="section-title"><h2>כל הביקורות</h2></div><p id="review-message" class="status-message">טוען ביקורות...</p>
        <section id="review-list" class="review-grid"></section>
    </main>
    <script src="/js/auth.js"></script><script src="/js/reviews.js"></script>
</body>
</html>
