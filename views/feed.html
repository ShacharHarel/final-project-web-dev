<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הפיד שלי</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <h1>הפיד שלי</h1>
        <nav>
            <a href="/profiles">פרופילים</a>
            <a href="/watch-history">היסטוריית צפייה</a>
            <a href="/reviews">ביקורות</a>
            <a href="/contents">קטלוג</a>
            <a href="/explore">חיפוש וסטטיסטיקות</a>
            <a id="user-management-link" href="/users" hidden>ניהול משתמשים</a>
            <button id="logout-button" type="button">התנתקות</button>
        </nav>
    </header>

    <main>
        <h2 id="welcome-message">טוען משתמש...</h2>

        <section class="feed-profile-section">
            <label for="feed-profile">בחירת פרופיל:</label>
            <select id="feed-profile"></select>
            <p id="feed-message"></p>
        </section>

        <section>
            <h2>המשך צפייה</h2>
            <div id="continue-watching" class="content-grid"></div>
        </section>

        <section>
            <h2>מומלץ עבורך</h2>
            <div id="recommendations" class="content-grid"></div>
        </section>

        <section>
            <h2>Top 10</h2>
            <div id="top-10" class="content-grid"></div>
        </section>

        <section>
            <h2>קטגוריות</h2>
            <div id="feed-categories"></div>
        </section>

        <section>
            <h2>ביקורות אחרונות</h2>
            <div id="latest-reviews" class="review-grid"></div>
        </section>
    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/feed.js"></script>
</body>
</html>
