<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix - הפיד שלי</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="app-page feed-page">
    <header class="top-nav">
        <a class="brand-logo" href="/feed">NETFLIX</a>
        <nav class="nav-links">
            <a class="active" href="/feed">⌂ בית</a>
            <a href="/contents">▶ קטלוג</a>
            <a href="/profiles">♙ פרופילים</a>
            <a href="/watch-history">◷ היסטוריה</a>
            <a href="/reviews">★ ביקורות</a>
            <a href="/explore">⌕ חיפוש</a>
            <a href="/services">⌖ מפה</a>
            <a id="user-management-link" href="/users" hidden>⚙ משתמשים</a>
        </nav>
        <button id="logout-button" class="logout-button" type="button">↪ יציאה</button>
    </header>

    <section class="feed-hero">
        <div class="feed-hero-content">
            <span class="netflix-label">N SERIES</span>
            <h1>STRANGER THINGS</h1>
            <p>כוחות על־טבעיים, סודות וחבורה אחת שלא מוותרת. התחילו לצפות עכשיו.</p>
            <div class="hero-actions">
                <a class="play-button" href="/contents">▶ צפייה</a>
                <a class="info-button" href="/explore">ⓘ מידע נוסף</a>
            </div>
        </div>
    </section>

    <main class="feed-main">
        <section class="profile-bar">
            <div>
                <h2 id="welcome-message">טוען משתמש...</h2>
                <p id="feed-message" class="muted-text"></p>
            </div>
            <label for="feed-profile">מי צופה?</label>
            <select id="feed-profile"></select>
        </section>

        <section class="content-row-section">
            <h2>המשך צפייה</h2>
            <div id="continue-watching" class="content-grid"></div>
        </section>
        <section class="content-row-section">
            <h2>מומלץ עבורך</h2>
            <div id="recommendations" class="content-grid"></div>
        </section>
        <section class="content-row-section">
            <h2>10 המובילים היום</h2>
            <div id="top-10" class="content-grid top-ten-row"></div>
        </section>
        <section class="content-row-section">
            <h2>חיפוש לפי קטגוריה</h2>
            <div id="feed-categories"></div>
        </section>
        <section class="content-row-section">
            <h2>ביקורות אחרונות</h2>
            <div id="latest-reviews" class="review-grid"></div>
        </section>
    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/feed.js"></script>
</body>
</html>
