<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>חיפוש מתקדם וסטטיסטיקות</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <h1>חיפוש וסטטיסטיקות</h1>
        <a href="/feed">חזרה לפיד</a>
    </header>

    <main>
        <section class="explore-form-section">
            <h2>חיפוש לפי קטגוריה, סוג ודירוג</h2>
            <form id="advanced-search-form">
                <input id="advanced-category" type="text" placeholder="קטגוריה" required>
                <select id="advanced-type" required>
                    <option value="">סוג תוכן</option>
                    <option value="movie">סרט</option>
                    <option value="series">סדרה</option>
                </select>
                <input id="advanced-rating" type="number" min="0" max="10" step="0.1" placeholder="דירוג מינימלי" required>
                <button type="submit">חיפוש</button>
            </form>
        </section>

        <section class="explore-form-section">
            <h2>חיפוש לפי שם וטווח שנים</h2>
            <form id="year-search-form">
                <input id="year-title" type="text" placeholder="שם או חלק משם" required>
                <input id="from-year" type="number" placeholder="משנה" required>
                <input id="to-year" type="number" placeholder="עד שנה" required>
                <button type="submit">חיפוש</button>
            </form>
        </section>

        <p id="explore-message"></p>
        <section id="explore-results" class="content-grid"></section>

        <section>
            <h2>סיכום לפי קטגוריה</h2>
            <div id="category-stats" class="stats-grid"></div>
        </section>

        <section>
            <h2>סיכום לפי סוג תוכן</h2>
            <div id="type-stats" class="stats-grid"></div>
        </section>
    </main>

    <script src="/js/explore.js"></script>
</body>
</html>
