<!DOCTYPE html>
<!-- מסך הרשמה: אוסף שם משתמש, אימייל וסיסמה ליצירת חשבון. -->
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הרשמה ל־Netflix</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
    <header class="top-nav auth-nav">
        <a class="brand-logo" href="/"><img src="/images/netflix-logo.svg" alt="Netflix"></a>
    </header>

    <main class="auth-main">
        <section class="auth-section">
            <h1>יצירת חשבון</h1>
            <form id="register-form" class="auth-form">
                <input id="username" type="text" placeholder="שם משתמש" minlength="3" required>
                <input id="email" type="email" placeholder="אימייל" autocomplete="email" required>
                <input id="password" type="password" placeholder="סיסמה" minlength="6" autocomplete="new-password" required>
                <button type="submit">הרשמה</button>
            </form>
            <p id="auth-message" class="form-message"></p>
            <p class="muted-text">כבר יש לכם חשבון? <a href="/login">התחברו</a></p>
            <a class="back-link" href="/">⌂ חזרה לדף הבית</a>
        </section>
    </main>

    <script src="/js/auth.js"></script>
</body>
</html>
