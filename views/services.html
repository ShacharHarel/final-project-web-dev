<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מפה ושירות חיצוני</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <h1>מפה ומידע חיצוני</h1>
        <a href="/feed">חזרה לפיד</a>
    </header>

    <main>
        <section>
            <h2>מיקום תוכן</h2>
            <select id="map-content"></select>
            <p id="map-address"></p>
            <iframe id="map-frame" title="מפת מיקום" loading="lazy"></iframe>
        </section>

        <section class="external-service-section">
            <h2>מידע על סדרה מ־TVmaze</h2>
            <form id="external-search-form">
                <input id="external-title" type="text" placeholder="שם סדרה" required>
                <button type="submit">חיפוש מידע</button>
            </form>
            <p id="external-message"></p>
            <article id="external-result" class="external-result"></article>
        </section>
    </main>

    <script src="/js/services.js"></script>
</body>
</html>
