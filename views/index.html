<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix - פרויקט גמר</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="landing-page">
    <header class="top-nav landing-nav">
        <a class="brand-logo" href="/"><img src="/images/netflix-logo.svg" alt="Netflix"></a>
        <a class="nav-button" href="/login">כניסה</a>
    </header>

    <main class="landing-hero">
        <div class="hero-overlay">
            <div class="landing-content">
                <h1>סרטים, סדרות ותכנים ללא הגבלה</h1>
                <p>צפו בכל מקום. בחרו פרופיל וקבלו המלצות אישיות.</p>
                <p class="hero-small">מוכנים לצפות? התחברו או צרו חשבון חדש.</p>
                <div class="hero-actions">
                    <a class="primary-button" href="/register">התחילו עכשיו ◀</a>
                    <a class="secondary-button" href="/contents">צפייה בקטלוג</a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
